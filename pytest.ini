[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q
    --ignore=tests/test_experiment4_benchmarks.py
    --ignore=tests/test_experiment4_heuristic_generation_script.py
    --ignore=tests/test_experiment4_scoring.py
    --ignore=tests/test_repository_readiness.py
pythonpath = .
markers =
    integration: marks tests as slow integration tests requiring external dependencies (like prosimos)
