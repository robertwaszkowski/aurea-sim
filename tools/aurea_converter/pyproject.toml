[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aurea-definition-converter"
version = "0.2.0"
description = "Standalone old-Aurea AuGraph conversion tool"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
aurea-convert-process = "aurea_converter.cli:process_main"
aurea-convert-source = "aurea_converter.cli:source_main"

[tool.setuptools]
packages = ["aurea_converter"]
