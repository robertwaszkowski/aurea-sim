[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aureasim"
version = "1.3.0"
description = "AI-assisted preparation, review, and execution of BPMN process simulations"
authors = [
    { name="Robert Waszkowski", email="robert.waszkowski@wat.edu.pl" }
]
requires-python = ">=3.9,<3.12"
dependencies = [
    "prosimos==1.2.4",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "numpy>=1.24.0",
    "python-docx>=1.1.0",
    "rich>=13.0.0",
    "questionary>=2.0.0",
    "google-genai>=0.2.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "fpdf2>=2.7.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",
    "openpyxl>=3.1.0",
    "pytest>=8.0"
]

[project.scripts]
aureasim-run = "run_experiment:main"

[tool.setuptools]
packages = ["aureasim"]
py-modules = ["run_experiment", "server", "wizard"]
